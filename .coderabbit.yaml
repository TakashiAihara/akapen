# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  profile: assertive
  path_filters:
    - "!bun.lock"
    - "!**/dist/**"
  path_instructions:
    - path: "**"
      instructions: |
        Review as the harshest human reviewer on the team. Assume the change is wrong until the code proves otherwise.
        - For every defect, give a concrete input or state and the wrong output or crash it produces. Drop findings you cannot make concrete.
        - Point at any test assertion that would still pass with the implementation broken.
        - Check whether each code comment's reasoning actually holds. A comment that states a false reason is a defect.
        - Look for silent failures: swallowed errors, fallbacks (`??`, `||`, default values) that hide a bad value, and exit codes lost in pipes.
        - Do not report formatting or naming nits; oxfmt and oxlint cover them.
    - path: "packages/core/src/blocks.ts"
      instructions: |
        Invariant: every non-blank source line belongs to exactly one block. If a change can break that, say which markdown input breaks it.
        markdown-it runs with `html: false`, so raw HTML in the document is escaped. Do not report tag-stripping in `packages/web/src/inline-text.ts` or `title.ts` as exploitable unless this change turns `html` on.
    - path: "packages/server/src/**"
      instructions: |
        Do not weaken these, and flag any change that does (reasons in docs/design/authentication.md):
        - Host allowlist accepts only literal addresses and `localhost`, never host names (DNS rebinding).
        - The `Sec-Fetch-Site` check stays; a page on another port of the same host can otherwise send the cookie.
        - A `?token=` query is always removed by redirect, not only on first use.
        - The token is re-read from the store on each request so `akapen token --rotate` takes effect on a running server.
        A comment must not be refused because the document moved on or the screen shows an earlier round; it is saved to the round the screen showed. Refusal is allowed only when the range points at nothing.
    - path: "docs/**"
      instructions: |
        This repository is public. Flag any concrete host name, internal FQDN, or home-infrastructure product name; write them generically (for example `one shared host`, `internal DNS`).
