# Git hooks: the same checks CI runs, failing locally first.
# Passing here does not skip CI, which runs them again — hooks can be bypassed with --no-verify.

pre-commit:
  parallel: true
  jobs:
    - name: format
      # Fix and re-stage. There is no reason to fail and make a person do it by hand
      glob: '*.{js,ts,json}'
      run: bunx oxfmt {staged_files}
      stage_fixed: true

    - name: lint
      glob: '*.{js,ts}'
      run: bunx oxlint {staged_files}

pre-push:
  jobs:
    # Before the checks, not as one of them. packages/server/src/assets.ts imports
    # @akapen/web/dist/app.js, so on a tree where nothing has built it yet every
    # test that starts a server fails to resolve the module — 91 failures that say
    # nothing about the change being pushed. CI builds first for the same reason;
    # this is the local half of that.
    - name: build:web
      run: bun run build:web

    - name: typecheck
      run: bun run typecheck

    - name: test
      run: bun run test
