# Git hooks: the same checks CI runs, failing locally first.
# Passing here does not skip CI, which runs them again — hooks can be bypassed with --no-verify.

pre-commit:
  parallel: true
  jobs:
    - name: format
      # Fix and re-stage. There is no reason to fail and make a person do it by hand
      glob: '*.{js,ts,json}'
      run: bunx oxfmt {staged_files}
      stage_fixed: true

    - name: lint
      glob: '*.{js,ts}'
      run: bunx oxlint {staged_files}

pre-push:
  jobs:
    # Before the tests, because some of them read build output. CI's unit job builds
    # first for the same reason; without it here, a clean checkout fails the suite on
    # a missing `dist` rather than on anything that is wrong with the code.
    - name: build the browser bundles
      run: bun run build:web

    - name: typecheck
      run: bun run typecheck

    - name: test
      run: bun run test
