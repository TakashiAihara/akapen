<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>akapen</title>
<link rel="stylesheet" href="/style.css">
<!-- 拡張 CSS は常に最後。既定のスタイルを上書きできることを設計で保証する -->
<link rel="stylesheet" href="/custom.css">
</head>
<body>
<header class="topbar">
  <span class="brand">akapen</span>
  <span class="file" id="filePath"></span>
  <span class="round" id="round"></span>
  <select class="round-pick" id="roundPick" aria-label="表示するラウンド"></select>
  <span class="spacer"></span>
  <label class="toggle"><input type="checkbox" id="showLines"> 行番号</label>
  <span class="count" id="count"></span>
</header>
<!-- 本文は現ラウンドの凍結スナップショット。live の変更はここで知らせるだけで、進むのは人が押した時 -->
<div class="banner" id="banner" hidden>
  <span class="banner-text" id="bannerText"></span>
  <button class="primary" id="nextRound">このラウンドを終える</button>
</div>
<!-- 過去ラウンドを見ている間。当時の本文と当時のコメントがそのまま出る -->
<div class="banner history" id="historyBar" hidden>
  <span class="banner-text" id="historyText"></span>
  <button id="backToCurrent">現在のラウンドへ</button>
</div>
<main class="stage">
  <div id="doc" class="doc"></div>
  <!-- コメントは本文の行間に差し込まず、ここに逃がす。本文の読みを分断しないため -->
  <aside id="rail" class="rail">
    <button type="button" class="rail-close" id="railClose" aria-label="レールを閉じる" title="閉じる">×</button>
    <div id="railAnchored" class="rail-anchored"></div>
    <!-- 持ち越さない代わりに、過去ラウンドの未解決はここに残す -->
    <section id="railCarried" class="rail-carried" hidden></section>
  </aside>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
