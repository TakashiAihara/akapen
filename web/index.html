<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>akapen</title>
<link rel="stylesheet" href="/style.css">
<!-- Extra CSS always comes last, so overriding the defaults is guaranteed by construction -->
<link rel="stylesheet" href="/custom.css">
</head>
<body>
<header class="topbar">
  <span class="brand">akapen</span>
  <span class="file" id="filePath"></span>
  <span class="round" id="round"></span>
  <select class="round-pick" id="roundPick" aria-label="Round to display"></select>
  <span class="spacer"></span>
  <label class="toggle"><input type="checkbox" id="showLines"> Line numbers</label>
  <span class="count" id="count"></span>
</header>
<!-- The document is the current round's frozen snapshot. A live change is only announced here; moving on takes a click -->
<div class="banner" id="banner" hidden>
  <span class="banner-text" id="bannerText"></span>
  <button class="primary" id="nextRound">End this round</button>
</div>
<!-- While viewing a past round: the document and comments exactly as they were -->
<div class="banner history" id="historyBar" hidden>
  <span class="banner-text" id="historyText"></span>
  <button id="backToCurrent">Back to the current round</button>
</div>
<main class="stage">
  <div id="doc" class="doc"></div>
  <!-- Comments go here instead of between the lines, so reading is never interrupted -->
  <aside id="rail" class="rail">
    <button type="button" class="rail-close" id="railClose" aria-label="Close the rail" title="Close">×</button>
    <div id="railAnchored" class="rail-anchored"></div>
    <!-- Nothing carries over, so earlier unresolved comments stay here -->
    <section id="railCarried" class="rail-carried" hidden></section>
  </aside>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
