name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to release (for example v0.1.0)'
        required: true

permissions:
  contents: write
  # A checksum from the same release proves nothing about authenticity. Attach provenance
  # so which workflow built it, from which commit, can be verified.
  id-token: write
  attestations: write

jobs:
  # Pinned to commits rather than tags, same as ci.yml. This one matters more: the job
  # holds contents:write and signs provenance, so an action swapped under a moved tag
  # would be attested as ours. Version lives in the trailing comment.
  build:
    runs-on: ubuntu-latest
    steps:
      # On a manual run inputs.tag and the default branch HEAD disagree. Without an
      # explicit ref, binaries whose contents do not match the tag end up in the release
      # and become impossible to tell apart later. A missing tag fails here, so no
      # release is created for a tag that does not exist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile

      # bun cross-compiles, so all four are built on one machine. Splitting the runners
      # per OS weakens the guarantee that they came from the same input.
      - name: build
        run: |
          set -eux
          bun run build:web
          mkdir -p dist
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build --compile --target="bun-$t" packages/cli/src/cli.ts --outfile "dist/akapen-$t"
          done
          cd dist && sha256sum akapen-* > SHA256SUMS && cat SHA256SUMS

      - name: check the built binary runs (only the one this runner can execute)
        run: ./dist/akapen-linux-x64 --help

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/akapen-*'

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eux
          gh release create "$TAG" --title "$TAG" --generate-notes dist/akapen-* dist/SHA256SUMS \
            || gh release upload "$TAG" dist/akapen-* dist/SHA256SUMS --clobber
