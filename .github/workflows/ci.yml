name: ci

on:
  push:
    branches: [main]
  pull_request:

# The repository default is read, but a default is a setting someone can change, and a
# fork carries its own. Nothing here writes; say so where the workflow is read.
permissions:
  contents: read

jobs:
  # Every action is pinned to a commit, not a tag. A tag is mutable, so whoever can move
  # it can run their code inside this workflow with the repository's token. The version
  # is kept in the trailing comment because a bare SHA says nothing to a reader; both
  # change together on a bump.

  # Mistakes in the workflows and the installer are not caught by CI; they surface when
  # a tag is pushed, or when someone runs curl | sh. Pull that forward.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This file gets piped into sh, so it is the most expensive place to be wrong
      - name: shellcheck (install.sh)
        run: shellcheck install.sh

      # Catch workflow mistakes before a tag is pushed
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile

      - run: bun run build:web
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run typecheck
      - name: line mapping and round invariants
        run: bun run test
      - name: block splitting across every markdown file under docs
        run: bun run sweep docs

      # Avoid finding out at release time. Embedding only works through static analysis,
      # so adding a file to the build output and forgetting packages/server/src/assets.ts fails here.
      - name: build the single binary and check it runs
        run: bun run scripts/smoke-binary.ts

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bun run build:web

      # The browsers live outside node_modules, under ~/.cache/ms-playwright, and which
      # build they are is decided by the playwright version alone. Keying on that version
      # rather than on bun.lock means a lockfile change that leaves playwright where it is
      # still hits.
      - name: the playwright version, for the cache key
        id: playwright
        run: echo "version=$(bunx playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # No --with-deps, so no apt. Every shared library chromium asks for is already on
      # the runner image — the nine packages the flag installs are fonts, and the fixture
      # is Latin, which the image's fonts-liberation covers. What that removes is not only
      # 40 of the 52 seconds this step used to take: reaching Ubuntu's mirrors was the
      # least reliable thing in the job. On 32273362486 the Azure mirror Ign'd every
      # index, apt fell back to archive.ubuntu.com, and the run sat on a single InRelease
      # file for 92 minutes before it was cancelled by hand.
      #
      # Not conditional on the cache hitting. A cache is an optimisation, and a miss has
      # to be slow rather than broken.
      - run: bunx playwright install chromium
        timeout-minutes: 5

      # Regressions only a real browser catches: focus, IME, ranges, re-rendering.
      # The storage-layer tests detected none of them.
      - run: bun run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
